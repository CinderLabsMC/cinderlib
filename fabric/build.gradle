plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "dev.architectury:architectury-fabric:${architectury_api_version}"

    implementation "com.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
    implementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}+fabric"
    runtimeOnly "maven.modrinth:jade:${jade_version}+fabric"

    implementation "com.terraformersmc:modmenu:${modmenu_version}"

    implementation project(':common')
}

// common hat keine fabric.mod.json und ist für den Fabric Loader daher kein Mod: Assets/Daten aus common
// müssen im Resources-Ordner dieses Moduls landen, sonst werden Lang/Modelle/Texturen nicht geladen.
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')
sourceSets.main.resources.srcDir project(':common').file('src/generated/resources')

tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.jar {
    from project(':common').sourceSets.main.output.classesDirs
}