subprojects {
    apply plugin: 'java-library'

    group = mod_group
    version = mod_version

    base.archivesName = "${mod_id}-${project.name}"

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = java_version as int
    }

    repositories {
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    }

    processResources {
        def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                     version: mod_version,
                     minecraft_version: minecraft_version]
        inputs.properties(props)
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) { expand props }
    }
}